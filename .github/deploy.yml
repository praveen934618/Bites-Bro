# BitesBro — manually deploy the React/Vite prototype to a Cloudflare Pages preview.
# This does not publish production backend, payment, or customer services.
name: Deploy BitesBro Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitesbro-preview-deployment
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Vite frontend
        run: npm run build

      - name: Validate build output
        run: test -f dist/index.html

      - name: Verify deployment settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CF_PROJECT" || { echo "::error::Missing CLOUDFLARE_PAGES_PROJECT variable"; exit 1; }

      - name: Deploy to Cloudflare Pages preview branch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=staging

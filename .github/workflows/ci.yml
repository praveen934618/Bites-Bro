name: BitesBro CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history is required so git diff --check can reach the merge base on PRs
          # and the parent commit on push events. Shallow clones (fetch-depth: 1) would
          # cause "fatal: bad object <sha>" when the base commit is not present locally.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Git whitespace hygiene
        run: |
          # On a pull_request event, compare every commit in the PR against the merge base.
          # On a push event, compare the pushed commits against their parent.
          # git diff --check exits non-zero on trailing whitespace or space-before-tab errors.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # When BASE is all-zeros the push introduced a new branch (no prior commits on this
          # ref in the remote). Fall back to the empty-tree object so git diff --check still
          # inspects every file added in this push without assuming HEAD~1 exists.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
            BASE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          fi
          git diff --check "$BASE" "$HEAD"

      - name: Run automated test suite
        run: npm test

      - name: Run TypeScript typecheck and production build
        run: npm run build

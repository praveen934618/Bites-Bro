<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="spBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <linearGradient id="spWedge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="60%" stop-color="#BF360C" />
      <stop offset="100%" stop-color="#671200" />
    </linearGradient>
    <filter id="spDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#spBg)" />
  <ellipse cx="200" cy="245" rx="120" ry="22" fill="#2A1A0E" opacity="0.15" />
  <!-- Ceramic Bowl -->
  <g filter="url(#spDrop)">
    <ellipse cx="200" cy="155" rx="125" ry="95" fill="#2A1A0E" />
    <ellipse cx="200" cy="150" rx="120" ry="90" fill="none" stroke="#F4AE52" stroke-width="2.5" opacity="0.5" />
    <ellipse cx="200" cy="152" rx="112" ry="82" fill="#180F08" />
    <!-- Lentils & Quinoa Bed -->
    <ellipse cx="200" cy="154" rx="104" ry="74" fill="#8D6E63" />
  </g>
  <!-- Baby Spinach Leaves -->
  <g fill="#2E7D32">
    <ellipse cx="140" cy="140" rx="20" ry="12" transform="rotate(-30 140 140)" />
    <ellipse cx="160" cy="125" rx="22" ry="14" transform="rotate(20 160 125)" />
    <ellipse cx="130" cy="165" rx="18" ry="11" transform="rotate(45 130 165)" />
  </g>
  <!-- Roasted Sweet Potato Wedges -->
  <g>
    <!-- Wedge 1 -->
    <path d="M 170 140 C 185 110, 220 120, 240 150 C 220 155, 190 150, 170 140 Z" fill="url(#spWedge)" />
    <path d="M 180 135 Q 210 130 230 148" stroke="#3E1100" stroke-width="2.5" stroke-linecap="round" />
    <!-- Wedge 2 -->
    <path d="M 195 155 C 215 125, 255 135, 270 165 C 245 172, 215 168, 195 155 Z" fill="url(#spWedge)" />
    <path d="M 210 150 Q 235 142 258 162" stroke="#3E1100" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <!-- Creamy Tahini Drizzle Ribbon -->
  <path d="M 140 160 Q 180 120 220 165 Q 260 140 270 180" stroke="#FFF8E1" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.9" />
  <!-- Pomegranate Jewels -->
  <circle cx="150" cy="180" r="4.5" fill="#AD1457" />
  <circle cx="165" cy="190" r="4" fill="#C2185B" />
  <circle cx="215" cy="185" r="4.5" fill="#880E4F" />
  <circle cx="240" cy="180" r="4" fill="#AD1457" />
</svg>

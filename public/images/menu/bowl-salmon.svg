<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="bsBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <linearGradient id="salmonFillet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="40%" stop-color="#D4621A" />
      <stop offset="100%" stop-color="#872902" />
    </linearGradient>
    <linearGradient id="avoSlice" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#33691E" />
      <stop offset="35%" stop-color="#689F38" />
      <stop offset="75%" stop-color="#AED581" />
      <stop offset="100%" stop-color="#DCEDC8" />
    </linearGradient>
    <filter id="bowlDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bsBg)" />
  <!-- Shadow -->
  <ellipse cx="200" cy="245" rx="120" ry="22" fill="#2A1A0E" opacity="0.15" />
  <!-- Ceramic Bowl -->
  <g filter="url(#bowlDrop)">
    <ellipse cx="200" cy="155" rx="125" ry="95" fill="#2A1A0E" />
    <ellipse cx="200" cy="150" rx="120" ry="90" fill="none" stroke="#F4AE52" stroke-width="2.5" opacity="0.6" />
    <ellipse cx="200" cy="152" rx="112" ry="82" fill="#180F08" />
    <!-- Rice/Quinoa Bed -->
    <ellipse cx="200" cy="154" rx="104" ry="74" fill="#FBF5E8" />
  </g>
  <!-- Greens (Broccolini) -->
  <g>
    <path d="M 125 140 C 115 120, 140 105, 155 115 C 170 102, 190 120, 185 138 C 190 152, 170 170, 150 162 Z" fill="#2E7D32" />
    <circle cx="140" cy="125" r="8" fill="#43A047" />
    <circle cx="160" cy="120" r="10" fill="#388E3C" />
    <circle cx="170" cy="140" r="9" fill="#1B5E20" />
  </g>
  <!-- Sliced Avocado Fan -->
  <g>
    <path d="M 215 110 C 245 92, 275 110, 285 140 C 275 145, 255 125, 215 110 Z" fill="url(#avoSlice)" stroke="#1B3A0F" stroke-width="2" />
    <path d="M 225 122 C 255 104, 285 122, 292 150 C 282 155, 262 135, 225 122 Z" fill="url(#avoSlice)" stroke="#1B3A0F" stroke-width="2" />
    <path d="M 235 135 C 262 118, 290 135, 296 162 C 286 167, 270 148, 235 135 Z" fill="url(#avoSlice)" stroke="#1B3A0F" stroke-width="2" />
  </g>
  <!-- Glazed Salmon Medallions -->
  <g>
    <path d="M 160 145 C 190 125, 235 132, 240 165 C 245 195, 205 210, 172 195 C 145 182, 142 160, 160 145 Z" fill="url(#salmonFillet)" />
    <!-- Sear marks -->
    <path d="M 170 158 Q 200 150 230 160" stroke="#3E1100" stroke-width="3" stroke-linecap="round" />
    <path d="M 175 174 Q 200 166 226 176" stroke="#3E1100" stroke-width="2.5" stroke-linecap="round" />
    <!-- Glaze sheen -->
    <path d="M 174 148 Q 200 138 228 152" stroke="#FFE0B2" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
  <!-- Edamame & Sesame -->
  <ellipse cx="140" cy="180" rx="9" ry="5" fill="#4CAF50" transform="rotate(-20 140 180)" />
  <ellipse cx="155" cy="190" rx="8" ry="5" fill="#66BB6A" transform="rotate(15 155 190)" />
  <g fill="#FFF9E6" opacity="0.9">
    <ellipse cx="190" cy="165" rx="1.5" ry="2.5" transform="rotate(25 190 165)" />
    <ellipse cx="205" cy="172" rx="1.5" ry="2.5" transform="rotate(-30 205 172)" />
    <ellipse cx="215" cy="162" rx="1.5" ry="2.5" transform="rotate(15 215 162)" />
  </g>
</svg>

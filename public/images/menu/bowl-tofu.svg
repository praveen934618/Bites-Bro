<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="tofuBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <linearGradient id="tofuGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4621A" />
      <stop offset="60%" stop-color="#943803" />
      <stop offset="100%" stop-color="#4E1E02" />
    </linearGradient>
    <filter id="tofuDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#tofuBg)" />
  <ellipse cx="200" cy="245" rx="120" ry="22" fill="#2A1A0E" opacity="0.15" />
  <!-- Bowl -->
  <g filter="url(#tofuDrop)">
    <ellipse cx="200" cy="155" rx="125" ry="95" fill="#2A1A0E" />
    <ellipse cx="200" cy="150" rx="120" ry="90" fill="none" stroke="#D4621A" stroke-width="2.5" opacity="0.6" />
    <ellipse cx="200" cy="152" rx="112" ry="82" fill="#180F08" />
    <!-- Soba Noodles Bed -->
    <ellipse cx="200" cy="154" rx="104" ry="74" fill="#6D5C50" />
    <!-- Soba noodle strands -->
    <path d="M 140 145 Q 180 135 220 150 Q 250 160 260 145" stroke="#8D7A6C" stroke-width="2.5" fill="none" />
    <path d="M 130 160 Q 170 170 210 155 Q 240 145 270 160" stroke="#8D7A6C" stroke-width="2" fill="none" />
    <path d="M 150 170 Q 190 180 230 168 Q 260 160 250 180" stroke="#52443A" stroke-width="2.2" fill="none" />
  </g>
  <!-- Bok Choy -->
  <g>
    <path d="M 125 150 C 115 125, 135 105, 160 115 C 150 135, 140 160, 130 170 Z" fill="#2E7D32" />
    <path d="M 120 160 C 125 145, 132 135, 145 130" stroke="#C8E6C9" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
  <!-- Crispy Tofu Cubes (Glazed) -->
  <g>
    <!-- Cube 1 -->
    <polygon points="175,130 205,122 225,138 195,146" fill="#F4AE52" />
    <polygon points="175,130 195,146 195,172 175,156" fill="url(#tofuGlaze)" />
    <polygon points="195,146 225,138 225,164 195,172" fill="#5E2201" />
    <!-- Cube 2 -->
    <polygon points="215,145 245,136 265,150 235,160" fill="#F4AE52" />
    <polygon points="215,145 235,160 235,185 215,170" fill="url(#tofuGlaze)" />
    <polygon points="235,160 265,150 265,175 235,185" fill="#5E2201" />
  </g>
  <!-- Radish Pickled Ribbons -->
  <path d="M 155 180 Q 170 195 190 185" stroke="#EC407A" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 170 195 Q 185 205 205 198" stroke="#F48FB1" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Scallions & Sesame -->
  <circle cx="210" cy="140" r="3" fill="#4CAF50" />
  <circle cx="240" cy="150" r="3" fill="#4CAF50" />
  <ellipse cx="190" cy="138" rx="1.5" ry="2.5" fill="#FFFFFF" transform="rotate(20 190 138)" />
  <ellipse cx="230" cy="142" rx="1.5" ry="2.5" fill="#FFFFFF" transform="rotate(-30 230 142)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="chkBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <linearGradient id="chkBraise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4621A" />
      <stop offset="50%" stop-color="#A04000" />
      <stop offset="100%" stop-color="#5B1E00" />
    </linearGradient>
    <filter id="chkDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#chkBg)" />
  <ellipse cx="200" cy="245" rx="120" ry="22" fill="#2A1A0E" opacity="0.15" />
  <!-- Terracotta Clay Platter -->
  <g filter="url(#chkDrop)">
    <ellipse cx="200" cy="155" rx="125" ry="95" fill="#2A1A0E" />
    <ellipse cx="200" cy="150" rx="120" ry="90" fill="none" stroke="#D4621A" stroke-width="2.5" opacity="0.6" />
    <ellipse cx="200" cy="152" rx="112" ry="82" fill="#3D2010" />
    <!-- Turmeric Saffron Basmati Rice -->
    <ellipse cx="200" cy="154" rx="104" ry="74" fill="#FBC02D" />
  </g>
  <!-- Braised Chicken Thigh with glazed skin -->
  <g>
    <path d="M 155 145 C 160 115, 230 115, 255 140 C 265 170, 220 200, 175 185 C 150 175, 145 160, 155 145 Z" fill="url(#chkBraise)" />
    <!-- Sear & glaze sheen -->
    <path d="M 175 138 Q 210 130 240 142" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 170 155 Q 210 148 245 160" stroke="#3E1100" stroke-width="3" stroke-linecap="round" />
    <path d="M 180 170 Q 215 162 235 172" stroke="#3E1100" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <!-- Sweet Corn Kernels -->
  <circle cx="135" cy="155" r="4" fill="#FFF176" stroke="#F57F17" stroke-width="0.8" />
  <circle cx="145" cy="165" r="4" fill="#FFF176" stroke="#F57F17" stroke-width="0.8" />
  <circle cx="138" cy="175" r="4" fill="#FFF176" stroke="#F57F17" stroke-width="0.8" />
  <circle cx="150" cy="182" r="3.5" fill="#FFF176" stroke="#F57F17" stroke-width="0.8" />
  <!-- Cilantro / Scallion Garnish -->
  <circle cx="195" cy="148" r="3" fill="#43A047" />
  <circle cx="218" cy="152" r="3" fill="#43A047" />
  <circle cx="205" cy="164" r="3" fill="#2E7D32" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="mangoBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <linearGradient id="mangoPuree" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="40%" stop-color="#FB8C00" />
      <stop offset="85%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>
    <linearGradient id="coconutPanna" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#EFE6D5" />
    </linearGradient>
    <filter id="mangoDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#mangoBg)" />
  <ellipse cx="200" cy="245" rx="85" ry="18" fill="#2A1A0E" opacity="0.14" />

  <!-- Glass Dessert Verrine / Tumbler -->
  <g filter="url(#mangoDrop)">
    <!-- Glass outer contour -->
    <path d="M 152 110 L 160 225 C 160 238, 240 238, 240 225 L 248 110 Z" fill="#EFEBE9" opacity="0.38" stroke="rgba(255,255,255,0.8)" stroke-width="2" />

    <!-- Bottom Layer: Delicate Ivory Coconut Milk Panna Cotta -->
    <path d="M 157 165 L 161 224 C 161 234, 239 234, 239 224 L 243 165 Z" fill="url(#coconutPanna)" />

    <!-- Top Layer: Alphonso Mango Coulis Purée -->
    <path d="M 154 125 L 157 168 C 170 174, 230 174, 243 168 L 246 125 Z" fill="url(#mangoPuree)" />

    <!-- Puree surface top ellipse & glaze sheen -->
    <ellipse cx="200" cy="125" rx="46" ry="13" fill="#FFB74D" stroke="#FB8C00" stroke-width="1.2" />
    <ellipse cx="196" cy="123" rx="38" ry="9" fill="#FFA726" opacity="0.85" />
    <path d="M 170 122 Q 195 117 222 123" stroke="#FFF9C4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Glass Specular Highlights -->
    <path d="M 156 120 L 162 225" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 160 125 L 165 215" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Pure Kashmiri Saffron Syrup Drizzle Ribbon -->
  <path d="M 175 125 Q 192 130 205 122 Q 220 115 225 125" stroke="#D84315" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Saffron Strands on Top -->
  <path d="M 188 120 Q 194 114 200 118" stroke="#E53935" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 204 122 Q 212 118 218 124" stroke="#E53935" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Fresh Mint Leaf Sprig Garnish -->
  <g>
    <!-- Leaf 1 (Left) -->
    <path d="M 200 120 C 185 105, 175 110, 185 118 C 192 122, 198 121, 200 120 Z" fill="#2E7D32" />
    <path d="M 200 120 C 190 110, 182 113, 185 118" stroke="#81C784" stroke-width="1" fill="none" />
    <!-- Leaf 2 (Right) -->
    <path d="M 200 120 C 215 102, 225 108, 215 116 C 208 120, 202 121, 200 120 Z" fill="#388E3C" />
    <path d="M 200 120 C 210 108, 218 111, 215 116" stroke="#A5D6A7" stroke-width="1" fill="none" />
  </g>

  <!-- Crushed Pistachio / Golden Coconut Garnish Specks -->
  <circle cx="178" cy="122" r="2" fill="#7CB342" />
  <circle cx="184" cy="125" r="1.8" fill="#8BC34A" />
  <circle cx="218" cy="125" r="2" fill="#7CB342" />
  <circle cx="224" cy="122" r="1.6" fill="#8BC34A" />
  <circle cx="210" cy="126" r="1.5" fill="#FFE082" />
</svg>

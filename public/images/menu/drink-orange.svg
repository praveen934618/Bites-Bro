<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="drkBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <linearGradient id="drkJuice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="60%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>
    <filter id="drkDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#drkBg)" />
  <ellipse cx="200" cy="245" rx="80" ry="16" fill="#2A1A0E" opacity="0.12" />
  <!-- Glassware & Beverage -->
  <g filter="url(#drkDrop)">
    <!-- Glass body -->
    <path d="M 160 85 L 168 230 C 168 240, 232 240, 232 230 L 240 85 Z" fill="#FFE082" opacity="0.3" stroke="rgba(255,255,255,0.8)" stroke-width="2" />
    <!-- Liquid -->
    <path d="M 163 115 L 169 228 C 170 236, 230 236, 231 228 L 237 115 Z" fill="url(#drkJuice)" opacity="0.9" />
    <!-- Ice cubes in glass -->
    <rect x="180" y="130" width="28" height="28" rx="4" fill="#FFFFFF" opacity="0.45" transform="rotate(15 180 130)" />
    <rect x="195" y="165" width="26" height="26" rx="4" fill="#FFFFFF" opacity="0.4" transform="rotate(-10 195 165)" />
    <!-- Rosemary Sprig -->
    <path d="M 200 170 Q 215 110 235 65" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 215 105 L 228 95" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 222 90 L 235 80" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 210 120 L 225 115" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round" />
    <!-- Citrus Wheel on Rim -->
    <circle cx="160" cy="85" r="22" fill="#E64A19" stroke="#FFE082" stroke-width="2" />
    <circle cx="160" cy="85" r="17" fill="#FF7043" />
    <line x1="160" y1="68" x2="160" y2="102" stroke="#FFE082" stroke-width="1.5" />
    <line x1="143" y1="85" x2="177" y2="85" stroke="#FFE082" stroke-width="1.5" />
  </g>
  <!-- Effervescence Bubbles -->
  <circle cx="185" cy="195" r="2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="198" cy="210" r="2.5" fill="#FFFFFF" opacity="0.75" />
  <circle cx="215" cy="190" r="1.5" fill="#FFFFFF" opacity="0.85" />
  <circle cx="178" cy="160" r="2" fill="#FFFFFF" opacity="0.8" />
</svg>

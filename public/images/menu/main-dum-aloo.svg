<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="dumBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <linearGradient id="dumGravy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4621A" />
      <stop offset="40%" stop-color="#B73210" />
      <stop offset="85%" stop-color="#7B1A04" />
      <stop offset="100%" stop-color="#4E0E02" />
    </linearGradient>
    <linearGradient id="potatoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D288" />
      <stop offset="60%" stop-color="#DE9E36" />
      <stop offset="100%" stop-color="#8E520D" />
    </linearGradient>
    <linearGradient id="parathaFlaky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1D6" />
      <stop offset="50%" stop-color="#E9BF7C" />
      <stop offset="100%" stop-color="#B87829" />
    </linearGradient>
    <filter id="dumDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#dumBg)" />
  <ellipse cx="200" cy="245" rx="120" ry="22" fill="#2A1A0E" opacity="0.15" />

  <!-- Ceramic Handi Platter -->
  <g filter="url(#dumDrop)">
    <ellipse cx="200" cy="155" rx="125" ry="95" fill="#2A1A0E" />
    <ellipse cx="200" cy="150" rx="120" ry="90" fill="none" stroke="#D4621A" stroke-width="2.5" opacity="0.6" />
    <ellipse cx="200" cy="152" rx="112" ry="82" fill="#1C1008" />
    <!-- Rich Kashmiri Red Gravy Base -->
    <ellipse cx="200" cy="154" rx="104" ry="74" fill="url(#dumGravy)" />
  </g>

  <!-- Gravy surface swirl & sheen -->
  <path d="M 140 150 Q 180 135 220 152 Q 255 165 240 180" stroke="#FF7A36" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 160 165 Q 195 180 230 160" stroke="#FFA366" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Whole Tender Baby Potatoes simmered in gravy -->
  <!-- Potato 1 (Center-Left) -->
  <g>
    <ellipse cx="168" cy="148" rx="22" ry="18" fill="url(#potatoGold)" transform="rotate(-15 168 148)" />
    <ellipse cx="164" cy="143" rx="14" ry="9" fill="#FFF2D6" opacity="0.5" />
    <!-- Gravy glaze glaze coating -->
    <path d="M 152 145 C 160 135, 180 140, 185 155 C 175 162, 158 158, 152 145 Z" fill="#B73210" opacity="0.65" />
  </g>

  <!-- Potato 2 (Center-Right) -->
  <g>
    <ellipse cx="215" cy="155" rx="24" ry="19" fill="url(#potatoGold)" transform="rotate(20 215 155)" />
    <ellipse cx="210" cy="149" rx="15" ry="10" fill="#FFF2D6" opacity="0.5" />
    <path d="M 198 152 C 208 142, 230 148, 235 162 C 224 168, 206 165, 198 152 Z" fill="#943803" opacity="0.65" />
  </g>

  <!-- Potato 3 (Back-Center) -->
  <g>
    <ellipse cx="192" cy="130" rx="18" ry="15" fill="url(#potatoGold)" transform="rotate(5 192 130)" />
    <ellipse cx="189" cy="126" rx="11" ry="7" fill="#FFF2D6" opacity="0.45" />
    <path d="M 180 128 C 188 120, 202 125, 206 138 Z" fill="#7B1A04" opacity="0.6" />
  </g>

  <!-- Flaky Golden Paratha (Layered Flatbread) -->
  <g>
    <!-- Folded Triangle 1 -->
    <path d="M 230 125 L 285 155 L 245 195 Z" fill="url(#parathaFlaky)" stroke="#8E520D" stroke-width="1.2" />
    <path d="M 238 135 L 278 158 L 248 185 Z" fill="#FDF1D6" opacity="0.6" />
    <!-- Char & Griddle marks on Paratha -->
    <ellipse cx="258" cy="150" rx="4" ry="2.5" fill="#5B2D05" opacity="0.8" />
    <ellipse cx="268" cy="162" rx="3.5" ry="2" fill="#5B2D05" opacity="0.75" />
    <ellipse cx="246" cy="165" rx="3" ry="1.8" fill="#5B2D05" opacity="0.8" />
    <!-- Flaky spiral seams -->
    <path d="M 240 140 Q 260 152 250 178" stroke="#A86B1E" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 252 145 Q 272 155 260 172" stroke="#A86B1E" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Pickled Red Onion Ribbons -->
  <path d="M 135 168 C 130 150, 142 138, 155 142" stroke="#E91E63" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 145 178 C 140 162, 152 152, 165 156" stroke="#F48FB1" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Fresh Coriander & Ginger Juliennes -->
  <g fill="#2E7D32">
    <circle cx="180" cy="142" r="3" />
    <circle cx="188" cy="152" r="3.5" />
    <circle cx="204" cy="140" r="3" />
    <circle cx="162" cy="160" r="2.8" />
  </g>
  <line x1="172" y1="135" x2="185" y2="148" stroke="#FFE082" stroke-width="2" stroke-linecap="round" />
  <line x1="195" y1="145" x2="208" y2="155" stroke="#FFE082" stroke-width="2" stroke-linecap="round" />

  <!-- Cream swirl drizzle -->
  <path d="M 145 158 Q 175 175 205 168 Q 225 180 215 190" stroke="#FFF9EB" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
</svg>

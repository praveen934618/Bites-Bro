<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="biryaniBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <linearGradient id="biryaniCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4621A" />
      <stop offset="50%" stop-color="#8E3A08" />
      <stop offset="100%" stop-color="#3A1702" />
    </linearGradient>
    <linearGradient id="lambMeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E360C" />
      <stop offset="50%" stop-color="#5E1F05" />
      <stop offset="100%" stop-color="#2E0E02" />
    </linearGradient>
    <filter id="biryaniDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#biryaniBg)" />
  <ellipse cx="200" cy="245" rx="120" ry="22" fill="#2A1A0E" opacity="0.15" />

  <!-- Traditional Copper Dum Platter -->
  <g filter="url(#biryaniDrop)">
    <ellipse cx="200" cy="155" rx="125" ry="95" fill="#2A1A0E" />
    <ellipse cx="200" cy="150" rx="120" ry="90" fill="none" stroke="#F4AE52" stroke-width="2.5" opacity="0.75" />
    <ellipse cx="200" cy="152" rx="112" ry="82" fill="url(#biryaniCopper)" />
    <!-- Aged Basmati Rice Mound (Golden Saffron & Pearl layers) -->
    <ellipse cx="200" cy="154" rx="104" ry="74" fill="#FDF7EA" />
    <ellipse cx="195" cy="152" rx="96" ry="66" fill="#FDD835" opacity="0.82" />
    <ellipse cx="205" cy="156" rx="88" ry="58" fill="#F57C00" opacity="0.45" />
  </g>

  <!-- Individual Basmati Rice Grains texture -->
  <g fill="#FFFDF5" stroke="#E0C996" stroke-width="0.75">
    <ellipse cx="145" cy="138" rx="7" ry="2.2" transform="rotate(25 145 138)" />
    <ellipse cx="160" cy="130" rx="7" ry="2.2" transform="rotate(-15 160 130)" />
    <ellipse cx="180" cy="125" rx="7.5" ry="2.2" transform="rotate(40 180 125)" />
    <ellipse cx="225" cy="132" rx="7" ry="2.2" transform="rotate(-35 225 132)" />
    <ellipse cx="245" cy="142" rx="7" ry="2.2" transform="rotate(15 245 142)" />
    <ellipse cx="135" cy="160" rx="7" ry="2.2" transform="rotate(-40 135 160)" />
    <ellipse cx="150" cy="175" rx="7.5" ry="2.2" transform="rotate(30 150 175)" />
    <ellipse cx="235" cy="175" rx="7" ry="2.2" transform="rotate(-20 235 175)" />
    <ellipse cx="250" cy="162" rx="7.5" ry="2.2" transform="rotate(50 250 162)" />
  </g>

  <!-- Tender Slow-Cooked Lamb Shank / Mutton Piece -->
  <g>
    <path d="M 170 142 C 175 118, 225 120, 240 145 C 248 170, 212 188, 182 178 C 165 170, 162 155, 170 142 Z" fill="url(#lambMeat)" />
    <!-- Roasted sear & spice crust -->
    <path d="M 182 135 Q 210 130 230 142" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 178 152 Q 205 146 235 158" stroke="#1A0700" stroke-width="3" stroke-linecap="round" />
    <path d="M 188 165 Q 212 158 228 168" stroke="#1A0700" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Caramelized Crispy Onions (Birista) Ribbons -->
  <g stroke="#3E1805" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M 148 148 Q 160 140 168 152" />
    <path d="M 155 162 Q 170 155 175 170" />
    <path d="M 215 130 Q 228 122 232 136" />
    <path d="M 235 148 Q 248 142 255 155" />
    <path d="M 195 178 Q 210 172 220 185" />
    <path d="M 175 182 Q 188 188 198 180" />
  </g>
  <g stroke="#8E4515" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M 150 146 Q 162 138 170 150" />
    <path d="M 233 146 Q 246 140 253 153" />
  </g>

  <!-- Whole Spices -->
  <!-- Star Anise -->
  <g transform="translate(142, 172) scale(0.65)">
    <path d="M 20 0 L 25 15 L 40 20 L 25 25 L 20 40 L 15 25 L 0 20 L 15 15 Z" fill="#421E09" />
    <circle cx="20" cy="20" r="5" fill="#6D3713" />
  </g>
  <!-- Cinnamon Stick Quill -->
  <rect x="220" y="165" width="28" height="6" rx="2.5" fill="#5D2D0C" stroke="#3E1B05" stroke-width="1" transform="rotate(-25 220 165)" />

  <!-- Saffron Strands (Pure Red Threads) -->
  <path d="M 160 135 Q 166 128 174 132" stroke="#E53935" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 205 125 Q 212 118 220 122" stroke="#E53935" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 190 175 Q 198 182 205 178" stroke="#E53935" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Fresh Mint Leaves & Split Cashews -->
  <g fill="#2E7D32">
    <ellipse cx="165" cy="168" rx="8" ry="4.5" transform="rotate(-35 165 168)" />
    <ellipse cx="225" cy="148" rx="8" ry="4.5" transform="rotate(30 225 148)" />
    <ellipse cx="198" cy="138" rx="7" ry="4" transform="rotate(10 198 138)" />
  </g>
  <path d="M 210 162 C 215 156, 224 158, 222 166 C 218 170, 212 168, 210 162 Z" fill="#FFF8E7" stroke="#D7CCC8" stroke-width="0.8" />
</svg>

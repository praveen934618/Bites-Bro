<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="pnrBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F4AE52" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#FEF3E2" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDF0D9" />
    </radialGradient>
    <filter id="pnrDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1A0E" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#pnrBg)" />
  <ellipse cx="200" cy="245" rx="120" ry="22" fill="#2A1A0E" opacity="0.15" />
  <!-- Cast Iron Skillet / Ceramic Plate -->
  <g filter="url(#pnrDrop)">
    <ellipse cx="200" cy="155" rx="125" ry="95" fill="#2A1A0E" />
    <ellipse cx="200" cy="150" rx="120" ry="90" fill="none" stroke="#D4621A" stroke-width="2" opacity="0.4" />
    <ellipse cx="200" cy="152" rx="112" ry="82" fill="#1C140D" />
  </g>
  <!-- Paneer Tikka Cubes -->
  <!-- Cube 1 (Center) -->
  <g>
    <polygon points="170,140 205,128 230,145 195,158" fill="#F4AE52" />
    <polygon points="170,140 195,158 195,188 170,170" fill="#D4621A" />
    <polygon points="195,158 230,145 230,175 195,188" fill="#943803" />
    <!-- Char mark -->
    <line x1="178" y1="145" x2="202" y2="137" stroke="#2A1A0E" stroke-width="3" stroke-linecap="round" />
    <line x1="185" y1="152" x2="215" y2="142" stroke="#2A1A0E" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <!-- Cube 2 (Right) -->
  <g>
    <polygon points="215,130 245,120 268,135 238,146" fill="#F4AE52" />
    <polygon points="215,130 238,146 238,172 215,156" fill="#D4621A" />
    <polygon points="238,146 268,135 268,162 238,172" fill="#943803" />
    <!-- Char mark -->
    <line x1="225" y1="135" x2="245" y2="128" stroke="#2A1A0E" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <!-- Charred Bell Peppers & Onion Petals -->
  <path d="M 140 160 C 135 140, 160 135, 168 150 C 160 168, 145 172, 140 160 Z" fill="#E53935" />
  <path d="M 142 152 Q 155 146 164 156" stroke="#2A1A0E" stroke-width="2" stroke-linecap="round" />
  <path d="M 235 168 C 245 160, 260 168, 255 180 C 242 186, 230 178, 235 168 Z" fill="#43A047" />
  <!-- Mint Chimichurri Drizzle -->
  <path d="M 130 180 Q 160 195 190 185 Q 220 175 240 195" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="150" cy="192" r="3" fill="#1B5E20" />
  <circle cx="210" cy="182" r="3" fill="#1B5E20" />
</svg>
